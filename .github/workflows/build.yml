name: Build iOS app

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx expo export --platform ios
      - uses: actions/upload-artifact@v4
        with:
          name: ios-dist
          path: dist
